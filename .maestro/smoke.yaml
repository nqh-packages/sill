appId: com.uxheavy.sill
---
# Doctor smoke flow: proves the iOS/iPadOS simulator build launches into the
# deterministic DEBUG LayoutHarness and renders the bottom PencilKit palette.
- launchApp:
    clearState: false
    arguments:
      SillLayout: "834x1194"
- assertVisible: "Apps"
- assertVisible: "Text size"
- assertVisible: "Keyboard"
- assertVisible: "Trackpad"
- assertVisible: "Controls"
- assertVisible: "Minimize controls"
- takeScreenshot: "smoke-pad-bottom"
