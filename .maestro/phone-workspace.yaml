appId: com.uxheavy.sill
---
# Proves unified PencilKit floating chrome + width-adaptive docked Control Deck on iPhone portrait.
- launchApp:
    clearState: false
    arguments:
      SillLayout: "402x874"
      SillIdiom: "phone"
- assertVisible: "Apps"
- assertVisible: "Keyboard"
- assertVisible: "Trackpad"
- assertVisible: "Controls"
- assertVisible: "Minimize controls"
- takeScreenshot: "01-phone-pencilkit-bottom"

# Minimize compact pill to corner orb and expand back
- tapOn: "Minimize controls"
- assertNotVisible: "Apps"
- assertVisible: "Controls"
- takeScreenshot: "02-phone-corner-orb"
- tapOn: "Controls"
- assertVisible: "Apps"
- assertVisible: "Trackpad"

# Open bottom-anchored Control Deck via Trackpad button, then stow back
- tapOn: "Trackpad"
- assertVisible: "Drag to move the pointer. Tap to click, two fingers to scroll."
- assertVisible: "Stow trackpad"
- takeScreenshot: "03-phone-control-deck"
- tapOn: "Stow trackpad"
- assertVisible: "Minimize controls"

# Open Control Center and verify Mac Menus route + Done
- tapOn: "Controls"
- assertVisible: "Mac mini"
- assertVisible: "Full Screen"
- assertVisible: "Menus"
- takeScreenshot: "04-phone-control-center"
- tapOn: "Menus"
- assertVisible: "File"
- takeScreenshot: "05-phone-mac-menus"
- tapOn: "Done"
- assertVisible: "Apps"
